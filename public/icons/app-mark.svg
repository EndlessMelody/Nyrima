<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="mk1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#5bc8e8"/>
    </linearGradient>
    <filter id="glow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow1)">
    <!-- angular N slab with cat-ear notches on both stem tops -->
    <path fill="url(#mk1)"
          d="M22 76 L22 18 L24.5 5 L31 16 L36 20 L60 52 L60 20 L65 16 L71.5 5 L74 18 L74 76 L60 76 L36 44 L36 76 Z"/>
    <!-- curled tail off the left stem -->
    <path d="M28 70 C 28 82, 13 87, 10.5 77 C 9.5 72.5 12.5 69.5 16 70.5"
          fill="none" stroke="url(#mk1)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
